<style>
:root{
  --bg:#0f1117; --surface:#1a1d27; --line:#252936; --text:#e8eaf0; --dim:#7b8194; --accent:#5b8def;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scrollbar-width:none}
::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:440px;margin:0 auto;padding:56px 24px 40px;display:flex;flex-direction:column;min-height:100%}

/* topo */
.now{text-align:center;padding-bottom:36px}
.status{font-size:12px;color:var(--dim);height:16px;letter-spacing:.02em}
.status.on{color:var(--accent)}
h1{font-weight:300;font-size:34px;letter-spacing:-.02em;margin:14px 0 4px;min-height:42px}
.sub{font-size:14px;color:var(--dim);min-height:20px}

.play{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);
  margin:32px auto 0;display:grid;place-items:center;cursor:pointer;transition:border-color .2s,background .2s}
.play:hover{border-color:var(--dim)}
.play:focus-visible,.row:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.play svg{width:22px;height:22px;fill:currentColor}
.play.on{background:var(--surface);border-color:var(--accent)}

.tools{display:flex;align-items:center;gap:20px;justify-content:center;margin-top:28px}
.tool{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;cursor:pointer;padding:4px 2px}
.tool:hover,.tool.act{color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:2px;background:var(--line);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:0}

/* lista */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;padding:10px 0;cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
.tab.act{color:var(--text);border-color:var(--text)}
.list{list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:14px 2px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.row:hover .name{color:#fff}
.name{flex:1;font-size:15px;transition:color .15s}
.tag{font-size:12px;color:var(--dim)}
.row.cur .name{color:var(--accent)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;width:14px;height:12px;opacity:0}
.eq i{width:2px;background:var(--accent);height:3px;border-radius:1px}
.row.cur .eq{opacity:1}
body.playing .row.cur .eq i{animation:eq 1s ease-in-out infinite}
body.playing .row.cur .eq i:nth-child(2){animation-delay:.2s}
body.playing .row.cur .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.ib{background:none;border:0;color:#4a5062;cursor:pointer;display:grid;place-items:center;width:30px;height:36px;transition:color .15s}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{color:var(--text)}
.ib.heart svg{fill:none}
.ib.heart.on{color:var(--accent)}
.ib.heart.on svg{fill:currentColor}
.ib.del:hover{color:#e5646b}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.edit{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.edit input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font:inherit;font-size:16px;outline:none;width:100%}
.edit input:focus{border-color:var(--accent)}
.edit .bt{display:flex;gap:8px}
.edit button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;font:inherit;font-size:14px;cursor:pointer}
.edit button.go{border-color:var(--accent);color:var(--accent)}
.restore{margin-top:18px;text-align:center}
.empty{color:var(--dim);font-size:13px;padding:24px 0;text-align:center}

/* adicionar */
details{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
summary{font-size:13px;color:var(--dim);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--text)}
form{display:grid;gap:10px;margin-top:14px}
form input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font:inherit;font-size:16px;outline:none}
form input:focus{border-color:var(--accent)}
form button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font:inherit;font-size:14px;cursor:pointer}
form button:hover{border-color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="now">
    <div class="status" id="status">offline</div>
    <h1 id="title">radio</h1>
    <div class="sub" id="sub">escolhe uma rádio</div>
    <button class="play" id="play" aria-label="Reproduzir">
      <svg viewBox="0 0 24 24" id="ico"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="tools">
      <button class="tool" id="sleep">timer</button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </section>

  <nav class="tabs">
    <button class="tab act" data-t="all">Rádios</button>
    <button class="tab" data-t="fav">Favoritos</button>
  </nav>
  <ul class="list" id="list"></ul>
  <div class="restore" id="restore"><button class="tool" id="restoreBtn">Repor rádios apagadas</button></div>

  <details>
    <summary>Adicionar rádio</summary>
    <form id="add">
      <input id="an" placeholder="Nome" required>
      <input id="au" type="url" placeholder="URL da stream (https)" required>
      <button>Guardar</button>
    </form>
  </details>
</main>

<audio id="audio" preload="none" playsinline></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>

const BUILTIN = [
  {id:"comercial", n:"Rádio Comercial", g:"Pop & Rock", u:BAUER("comercial"), q:"Rádio Comercial"},
  {id:"m80", n:"M80", g:"Anos 70–2000", u:BAUER("m80"), q:"M80"},
  {id:"cidade", n:"Cidade FM", g:"Charts & Dance", u:BAUER("cidade"), q:"Cidade FM"},
  {id:"smooth", n:"Smooth FM", g:"Jazz & Easy", u:BAUER("smooth"), q:"Smooth FM"},
  {id:"rfm", n:"RFM", g:"Pop & Hits", u:[ST("RFMAAC.aac"), ST("RFM.mp3")], q:"RFM"},
  {id:"renascenca", n:"Renascença", g:"Notícias & Pop", u:[ST("RADIO_RENASCENCAAAC.aac"), ST("RADIO_RENASCENCA.mp3")], q:"Rádio Renascença"},
  {id:"megahits", n:"Mega Hits", g:"Top 40", u:[ST("MEGA_HITS.mp3"), ST("MEGA_HITSAAC.aac")], q:"Mega Hits"},
  {id:"a1", n:"Antena 1", g:"Notícias & Música", u:["https://streaming-live.rtp.pt/liveradio/antena180a/playlist.m3u8","http://radiocast.rtp.pt/antena180a.mp3"], q:"Antena 1"},
  {id:"a2", n:"Antena 2", g:"Clássica & Cultura", u:["https://streaming-live.rtp.pt/liveradio/antena280a/playlist.m3u8","http://radiocast.rtp.pt/antena280a.mp3"], q:"Antena 2"},
  {id:"a3", n:"Antena 3", g:"Alternativo", u:["https://streaming-live.rtp.pt/liveradio/antena380a/playlist.m3u8","http://radiocast.rtp.pt/antena380a.mp3"], q:"Antena 3"},
  {id:"tsf", n:"TSF", g:"Notícias", u:["http://tsfdirecto.tsf.pt/tsfdirecto.mp3"], q:"TSF"},
  {id:"kiss", n:"Kiss FM", g:"Hits", u:[], q:"Kiss FM"},
  {id:"radar", n:"Rádio Radar", g:"Indie", u:[], q:"Rádio Radar"},
  {id:"oxigenio", n:"Oxigénio", g:"Dance & House", u:[], q:"Oxigénio"},
  {id:"orbital", n:"Orbital", g:"Electrónica", u:[], q:"Orbital"},
  {id:"novaera", n:"Nova Era", g:"Pop & Dance", u:[], q:"Nova Era"}
];
const RB = ["https://de1.api.radio-browser.info","https://nl1.api.radio-browser.info","https://at1.api.radio-browser.info"];

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const audio = $("audio");
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let own = store.get("radio.own", []);
/* migração da versão antiga (u era texto) */
own = own.map(o => ({...o, u: Array.isArray(o.u) ? o.u : [o.u]}));
let favs = new Set(store.get("radio.favs", []));
let ok = store.get("radio.ok", {});
let cur = store.get("radio.cur", null);
let tab = "all", hls = null, token = 0, attempting = false, wanted = false;

audio.volume = store.get("radio.vol", 0.8);
$("vol").value = audio.volume;

let hidden = new Set(store.get("radio.hidden", []));
let edits = store.get("radio.edits", {});
let editing = null;
const allRaw = () => BUILTIN.map(b => edits[b.id] ? {...b, ...edits[b.id]} : b).concat(own.map(o => ({...o, own:true})));
const all = () => allRaw().filter(s => !hidden.has(s.id));
const byId = id => allRaw().find(s => s.id === id);

/* ---------- Radio Browser (último recurso) ---------- */
async function rb(path){
  for(const base of RB){
    try{
      const c = new AbortController(); const t = setTimeout(()=>c.abort(), 6000);
      const r = await fetch(base + path, {signal:c.signal}); clearTimeout(t);
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return [];
}
const rbSearch = name => rb(`/json/stations/search?name=${encodeURIComponent(name)}&countrycode=PT&hidebroken=true&order=clickcount&reverse=true&limit=6`);
const rbUrls = arr => arr.map(x => x.url_resolved || x.url).filter(u => u && /^https:/.test(u));

/* ---------- reprodução ---------- */
const isHls = u => /\.m3u8(\?|$)/.test(u);
function killHls(){ if(hls){ try{hls.destroy()}catch(e){} hls=null; } }

function attempt(url){
  return new Promise((res, rej) => {
    killHls();
    let done = false;
    const fin = (good, why) => {
      if(done) return; done = true; clearTimeout(t);
      audio.removeEventListener("playing", onp); audio.removeEventListener("error", one);
      good ? res() : rej(why);
    };
    const onp = () => fin(true), one = () => fin(false, "erro");
    const t = setTimeout(() => fin(false, "timeout"), 9000);
    audio.addEventListener("playing", onp);
    audio.addEventListener("error", one);
    if(isHls(url)){
      if(audio.canPlayType("application/vnd.apple.mpegurl")){ audio.src = url; }
      else if(window.Hls && Hls.isSupported()){
        hls = new Hls({lowLatencyMode:false});
        hls.on(Hls.Events.ERROR, (e,d) => { if(d.fatal) fin(false,"hls"); });
        hls.loadSource(url); hls.attachMedia(audio);
      } else return fin(false, "sem hls");
    } else { audio.removeAttribute("src"); audio.src = url; }
    audio.load();
    const p = audio.play(); if(p && p.catch) p.catch(()=>{});
  });
}

async function start(id){
  const s = byId(id); if(!s) return;
  const tk = ++token; wanted = true; attempting = true;
  setStatus("a ligar…", false);
  const tried = new Set();
  const run = async list => {
    for(const u of list){
      if(tk !== token) return true;
      if(!u || tried.has(u)) continue; tried.add(u);
      try{ await attempt(u); ok[id] = u; store.set("radio.ok", ok); return true; }catch(e){}
    }
    return false;
  };
  let good = await run((ok[id] ? [ok[id]] : []).concat(s.u || []));
  if(!good && tk === token){
    setStatus("a procurar stream…", false);
    good = await run(rbUrls(await rbSearch(s.q || s.n)));
  }
  if(tk !== token) return;
  attempting = false;
  if(!good){ wanted = false; audio.pause(); setStatus("sem sinal · tenta outra", false); icon(false); }
}

function select(id){
  cur = id; store.set("radio.cur", id);
  paintHeader(); render(); setMedia();
  start(id);
}
function toggle(){
  if(!cur){ select(BUILTIN[0].id); return; }
  if(attempting){ token++; attempting = false; wanted = false; audio.pause(); icon(false); setStatus("em pausa", false); return; }
  if(audio.paused){ start(cur); }
  else { wanted = false; audio.pause(); }
}

function icon(on){
  $("ico").innerHTML = on ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("play").classList.toggle("on", on);
  $("play").setAttribute("aria-label", on ? "Pausar" : "Reproduzir");
}
function setStatus(t,on){ const s=$("status"); s.textContent=t; s.classList.toggle("on",!!on); }

audio.addEventListener("playing", () => { document.body.classList.add("playing"); setStatus("ao vivo", true); icon(true); if("mediaSession" in navigator) navigator.mediaSession.playbackState="playing"; });
audio.addEventListener("pause", () => { document.body.classList.remove("playing"); if(!attempting){ setStatus("em pausa", false); icon(false); } if("mediaSession" in navigator) navigator.mediaSession.playbackState="paused"; });
audio.addEventListener("waiting", () => { if(!attempting) setStatus("a carregar…", false); });
audio.addEventListener("error", () => {
  if(!attempting && wanted && cur){ setStatus("ligação perdida · a religar", false); start(cur); }
});

function setMedia(){
  if(!("mediaSession" in navigator) || !cur) return;
  const s = byId(cur); if(!s) return;
  navigator.mediaSession.metadata = new MediaMetadata({title:s.n, artist:s.g || "radio"});
  navigator.mediaSession.setActionHandler("play", () => start(cur));
  navigator.mediaSession.setActionHandler("pause", () => { wanted=false; audio.pause(); });
  navigator.mediaSession.setActionHandler("stop", () => { wanted=false; audio.pause(); });
}

/* ---------- UI ---------- */
function paintHeader(){
  const s = cur && byId(cur);
  $("title").textContent = s ? s.n : "radio";
  $("sub").textContent = s ? (s.g || "") : "escolhe uma rádio";
}

const IC = {
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.500S4.500 16 2.800 11.300C1.600 8 3.500 4.500 6.800 4.500c2 0 3.700 1.100 5.200 3.100 1.500-2 3.200-3.100 5.200-3.100 3.300 0 5.200 3.500 4 6.800C19.500 16 12 20.500 12 20.500z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19.500 8.500a2.100 2.100 0 0 0-3-3L5 17z"/><path d="M14.500 7.500l3 3"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>'
};
function ib(cls, svg, label, fn){
  const b = document.createElement("button");
  b.className = "ib " + cls; b.innerHTML = svg; b.setAttribute("aria-label", label); b.title = label;
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}
function saveAll(){
  store.set("radio.own", own); store.set("radio.favs",[...favs]);
  store.set("radio.hidden",[...hidden]); store.set("radio.edits", edits);
}
function remove(s){
  if(!confirm(`Apagar "${s.n}"?`)) return;
  if(s.own) own = own.filter(o => o.id !== s.id); else hidden.add(s.id);
  favs.delete(s.id);
  if(cur === s.id){ token++; attempting=false; wanted=false; audio.pause(); cur=null; store.set("radio.cur", null); paintHeader(); icon(false); setStatus("offline", false); }
  saveAll(); render();
}
function editRow(s){
  const li = document.createElement("li");
  const f = document.createElement("form"); f.className = "edit";
  const orig = BUILTIN.find(b => b.id === s.id);
  const curUrl = s.own ? s.u[0] : (edits[s.id] && edits[s.id].u ? edits[s.id].u[0] : "");
  f.innerHTML = '<input class="en" placeholder="Nome" required><input class="eu" type="url" placeholder="URL da stream (https)"><div class="bt"><button type="button" class="cx">Cancelar</button><button class="go">Guardar</button></div>';
  f.querySelector(".en").value = s.n;
  f.querySelector(".eu").value = curUrl || "";
  if(s.own) f.querySelector(".eu").required = true;
  else f.querySelector(".eu").placeholder = "URL da stream (vazio = automático)";
  f.querySelector(".cx").onclick = () => { editing = null; render(); };
  f.onsubmit = e => {
    e.preventDefault();
    const n = f.querySelector(".en").value.trim(), u = f.querySelector(".eu").value.trim();
    if(s.own){ const o = own.find(x => x.id === s.id); o.n = n; o.u = [u]; }
    else { edits[s.id] = {n}; if(u) edits[s.id].u = [u]; }
    delete ok[s.id]; store.set("radio.ok", ok);
    editing = null; saveAll(); paintHeader(); render();
  };
  li.append(f);
  setTimeout(() => f.querySelector(".en").focus(), 0);
  return li;
}

function render(){
  const items = all().filter(s => tab==="fav" ? favs.has(s.id) : true);
  const ul = $("list"); ul.innerHTML = "";
  if(!items.length){
    ul.innerHTML = `<li class="empty">${tab==="fav" ? "Ainda sem favoritos." : "Sem rádios."}</li>`;
  }
  items.forEach(s => {
    if(editing === s.id){ ul.append(editRow(s)); return; }
    const li = document.createElement("li");
    const row = document.createElement("button");
    row.className = "row" + (s.id===cur ? " cur" : "");
    row.innerHTML = '<span class="eq"><i></i><i></i><i></i></span><span class="name"></span>';
    row.querySelector(".name").textContent = s.n;
    row.onclick = () => select(s.id);
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;align-items:center;border-bottom:1px solid var(--line)";
    wrap.append(
      row,
      ib("heart" + (favs.has(s.id) ? " on" : ""), IC.heart, "Favorito", () => { favs.has(s.id) ? favs.delete(s.id) : favs.add(s.id); saveAll(); render(); }),
      ib("", IC.edit, "Editar", () => { editing = s.id; render(); }),
      ib("del", IC.del, "Apagar", () => remove(s))
    );
    li.append(wrap);
    ul.append(li);
  });
  const r = $("restore");
  r.style.display = (hidden.size && tab === "all") ? "block" : "none";
  r.querySelector("button").textContent = `Repor rádios apagadas (${hidden.size})`;
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("act", x===b));
  render();
});

$("restoreBtn").onclick = () => { hidden.clear(); saveAll(); render(); };
$("play").onclick = toggle;
$("vol").oninput = e => { audio.volume = +e.target.value; store.set("radio.vol", audio.volume); };

$("add").onsubmit = e => {
  e.preventDefault();
  own.push({ id:"own-"+Date.now(), n:$("an").value.trim(), g:"A minha", u:[$("au").value.trim()] });
  store.set("radio.own", own);
  e.target.reset(); e.target.closest("details").open = false;
  tab = "all";
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("act", x.dataset.t==="all"));
  render();
};

/* timer */
const STEPS = [0,15,30,60]; let si = 0, sleepT, sleepI;
$("sleep").onclick = () => {
  si = (si+1) % STEPS.length; clearTimeout(sleepT); clearInterval(sleepI);
  const btn = $("sleep");
  if(!STEPS[si]){ btn.textContent="timer"; btn.classList.remove("act"); return; }
  const end = Date.now() + STEPS[si]*60000; btn.classList.add("act");
  const tick = () => { btn.textContent = Math.max(0, Math.ceil((end-Date.now())/60000)) + " min"; };
  tick(); sleepI = setInterval(tick, 15000);
  sleepT = setTimeout(() => { wanted=false; audio.pause(); clearInterval(sleepI); btn.textContent="timer"; btn.classList.remove("act"); si=0; }, STEPS[si]*60000);
};

document.addEventListener("keydown", e => {
  if(/INPUT/.test(e.target.tagName)) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  if(e.code === "ArrowUp"){ audio.volume = Math.min(1, audio.volume+.05); $("vol").value = audio.volume; }
  if(e.code === "ArrowDown"){ audio.volume = Math.max(0, audio.volume-.05); $("vol").value = audio.volume; }
});

if(cur && !byId(cur)) cur = null;
paintHeader(); render(); setMedia();
</script>
</body>
</html>
